<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#151619;color:#eee;font:14px system-ui;padding:24px}h2{margin:0 0 8px}p{color:#aaa;line-height:1.6}button{background:#eee;border:0;border-radius:6px;padding:9px 14px;cursor:pointer}</style><h2>光鸭网盘</h2><p>此插件提供只读目录和按需播放地址。账号、扫码与虚拟挂载由下方的 FBZ 存储管理器处理。</p><button id="check">检查插件进程</button><p id="result" role="status"></p><script>let n=0;document.getElementById('check').onclick=()=>{const id=String(++n);parent.postMessage({type:'fbz-plugin-action',id,action:'status',payload:{}},'*')};addEventListener('message',event=>{if(event.data?.type==='fbz-plugin-result'){document.getElementById('result').textContent=event.data.error|| (event.data.result?.ready?'插件进程已连接':'插件未就绪')}})</script></html>
